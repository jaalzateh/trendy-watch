name: Probe Girly

# Checks from GitHub's servers that the watcher can read girlymaquillaje.com.
# Sends no alerts and saves nothing. Run it by hand before a launch to re-check.
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: First check reads the store and stays silent
        run: |
          rm -f state.json
          python watch.py | tee out1.txt
          grep -q "ok - Girly" out1.txt && ! grep -q "ALERT" out1.txt
      - name: It sees last year's calendars
        if: always()
        run: |
          cat state.json
          python -c "import json; s=json.load(open('state.json')); p=[v['name'] for k,v in s.items() if 'product:' in k]; print(p); assert len(p)>=2"
      - name: Second check stays silent
        if: always()
        run: |
          python watch.py | tee out2.txt
          grep -q "ok - Girly" out2.txt && ! grep -q "ALERT" out2.txt
      - name: Simulated restock of a known calendar fires the alert
        if: always()
        run: |
          python - <<'PY'
          import json
          s = json.load(open('state.json'))
          gone = [k for k in s if 'product:' in k][0]
          print('forgetting', s.pop(gone)['name'])
          json.dump(s, open('state.json', 'w'))
          PY
          python watch.py | tee out3.txt
          grep -q "ALERT: Girly: el calendario ya aparece" out3.txt
      - name: Drill on an in-stock product fires DISPONIBLE
        if: always()
        run: |
          KEYWORDS="oil to milk" python watch.py | tee out4.txt
          grep -q "ALERT: Girly: calendario de adviento DISPONIBLE" out4.txt
