name: Calendar watch

# How it keeps running: one run checks the stores every 30 seconds for 5 hours, then
# starts its own successor before it ends. GitHub's schedule is slow and
# unreliable, so it is only a safety net that restarts the chain if it breaks.

on:
  push:            # new watcher code replaces the running watcher right away
    branches: [main]
    paths: ["watch.py", ".github/workflows/watch.yml"]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test alert instead of checking"
        type: boolean
        default: false
      simulate:
        description: "Drill: pretend the calendar is called this (e.g. corrector de ojeras aura)"
        type: string
        default: ""
      minutes:
        description: "How long this run keeps watching before handing off"
        type: string
        default: "300"
      parent:
        description: "(internal) run that started this one"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      KEYWORDS: ${{ inputs.simulate || 'adviento,advent' }}
      MINUTES: ${{ inputs.simulate && '0' || inputs.minutes || '300' }}
      INTERVAL: "30"
      MODE: ${{ inputs.test && 'test' || inputs.simulate && 'drill' || 'watch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test alert
        if: env.MODE == 'test'
        run: python watch.py --test

      - name: Drill
        if: env.MODE == 'drill'
        run: python watch.py   # nothing is saved, so a drill cannot affect real detection

      - name: Is another watcher already running?
        id: guard
        if: env.MODE == 'watch'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            for id in $(gh run list --workflow watch.yml --status in_progress --json databaseId --jq '.[].databaseId'); do
              [ "$id" = "${{ github.run_id }}" ] || gh run cancel "$id" || true
            done
            sleep 30
          fi
          others=$(gh run list --workflow watch.yml --status in_progress --json databaseId \
            --jq '[.[] | select((.databaseId|tostring) != "${{ github.run_id }}" and (.databaseId|tostring) != "${{ inputs.parent }}")] | length')
          echo "other watchers running: $others"
          echo "alone=$([ "$others" = "0" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Watch the store
        if: steps.guard.outputs.alone == 'yes'
        run: LOOP_SECONDS=$((MINUTES * 60)) python watch.py

      - name: Remember what was seen
        if: ${{ always() && steps.guard.outputs.alone == 'yes' }}
        run: |
          git config user.name "trendy-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update state" && git pull --rebase && git push)

      - name: Hand off to the next run
        if: ${{ !cancelled() && steps.guard.outputs.alone == 'yes' }}
        run: gh workflow run watch.yml -f parent=${{ github.run_id }}
